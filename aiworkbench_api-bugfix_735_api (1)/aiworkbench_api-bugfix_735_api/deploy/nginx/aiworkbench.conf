# Production nginx site for AI Workbench.
# Install: copy to /etc/nginx/sites-available/aiworkbench and symlink into sites-enabled.
#
# Replace:
#   - aiworkbench.sciagen.ai with your hostname
#   - /var/www/aiworkbench/ui/dist with the built frontend path
#   - SSL certificate paths for your environment
#
# IMPORTANT: Serve the Vite production build (npm run build). Do not expose the Vite dev
# server (npm run dev) on the public internet.

server_tokens off;

map $sent_http_content_type $aiworkbench_html_cache_control {
    default                                 "public, max-age=31536000, immutable";
    "~*text/html"                           "no-store, no-cache, must-revalidate, private";
    "~*application/json"                    "no-store, no-cache, must-revalidate, private";
}

server {
    listen 80;
    listen [::]:80;
    server_name aiworkbench.sciagen.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiworkbench.sciagen.ai;

    ssl_certificate     /etc/letsencrypt/live/aiworkbench.sciagen.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiworkbench.sciagen.ai/privkey.pem;

    root /var/www/aiworkbench/ui/dist;
    index index.html;

    # Block Vite dev-server and source exposure paths (ZAP: source maps, node_modules, HMR token).
    location ~* ^/(node_modules|src|@vite|@react-refresh|@fs)(/|$) {
        return 404;
    }

    location /api {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cookie_path / /;
        proxy_pass_header Set-Cookie;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control $aiworkbench_html_cache_control always;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
