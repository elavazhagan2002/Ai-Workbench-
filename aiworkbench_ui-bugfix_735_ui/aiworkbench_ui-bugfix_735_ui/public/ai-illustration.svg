<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  
  <!-- Neural Network Nodes -->
  <g opacity="0.3">
    <circle cx="150" cy="150" r="8" fill="#3b82f6"/>
    <circle cx="300" cy="120" r="8" fill="#3b82f6"/>
    <circle cx="450" cy="150" r="8" fill="#3b82f6"/>
    <circle cx="180" cy="250" r="8" fill="#3b82f6"/>
    <circle cx="320" cy="240" r="8" fill="#3b82f6"/>
    <circle cx="420" cy="250" r="8" fill="#3b82f6"/>
    <circle cx="200" cy="350" r="8" fill="#3b82f6"/>
    <circle cx="300" cy="340" r="8" fill="#3b82f6"/>
    <circle cx="400" cy="350" r="8" fill="#3b82f6"/>
  </g>
  
  <!-- Neural Network Connections -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.2">
    <line x1="150" y1="150" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="450" y2="150"/>
    <line x1="150" y1="150" x2="180" y2="250"/>
    <line x1="300" y1="120" x2="320" y2="240"/>
    <line x1="450" y1="150" x2="420" y2="250"/>
    <line x1="180" y1="250" x2="200" y2="350"/>
    <line x1="320" y1="240" x2="300" y2="340"/>
    <line x1="420" y1="250" x2="400" y2="350"/>
  </g>
  
  <!-- Main Brain Icon -->
  <g transform="translate(200, 400)">
    <path d="M100 50 C80 50, 60 60, 50 80 C40 100, 40 120, 50 140 C60 160, 80 170, 100 170 C120 170, 140 160, 150 140 C160 120, 160 100, 150 80 C140 60, 120 50, 100 50 Z" 
          fill="url(#brainGrad)" opacity="0.9"/>
    <path d="M70 90 C75 85, 85 85, 90 90 M110 90 C115 85, 125 85, 130 90" 
          stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M85 110 C90 105, 100 105, 105 110 M95 130 C100 125, 110 125, 115 130" 
          stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="150" r="6" fill="white" opacity="0.8"/>
  </g>
  
  <!-- AI Text -->
  <text x="300" y="650" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="#3b82f6" text-anchor="middle" opacity="0.8">AI</text>
  <text x="300" y="690" font-family="Arial, sans-serif" font-size="24" 
        fill="#64748b" text-anchor="middle" opacity="0.6">Engineering Platform</text>
  
  <!-- Decorative Elements -->
  <g opacity="0.2">
    <circle cx="100" cy="600" r="4" fill="#3b82f6"/>
    <circle cx="500" cy="600" r="4" fill="#3b82f6"/>
    <circle cx="80" cy="700" r="3" fill="#3b82f6"/>
    <circle cx="520" cy="700" r="3" fill="#3b82f6"/>
  </g>
</svg>
