version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workbench-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Application
      - APP_NAME=${APP_NAME:-AI Workbench API}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=${RELOAD:-False}
      - WORKERS=${WORKERS:-4}
      
      # Database
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - SQLITE_DATABASE_PATH=/app/data/ai_workbench.db
      - SQLITE_CHECK_SAME_THREAD=False
      
      # MySQL (if using MySQL - uncomment mysql service below)
      - MYSQL_HOST=${MYSQL_HOST:-localhost}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ai_workbench}
      - MYSQL_POOL_PRE_PING=True
      - MYSQL_POOL_SIZE=5
      - MYSQL_MAX_OVERFLOW=10
      - MYSQL_POOL_RECYCLE=3600
      
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      
      # Client Credentials
      - CLIENT_ID=${CLIENT_ID:-ai-workbench-frontend}
      - CLIENT_SECRET=${CLIENT_SECRET}
      
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-True}
      - CORS_ALLOW_METHODS=${CORS_ALLOW_METHODS:-*}
      - CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS:-*}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/app.log
      - LOG_FILE_MAX_BYTES=${LOG_FILE_MAX_BYTES:-10485760}
      - LOG_FILE_BACKUP_COUNT=${LOG_FILE_BACKUP_COUNT:-5}
      - LOG_TO_CONSOLE=${LOG_TO_CONSOLE:-True}
      - LOG_TO_FILE=${LOG_TO_FILE:-True}
    volumes:
      # Persist database
      - backend-db-data:/app/data
      # Persist logs
      - backend-logs:/app/logs
    restart: unless-stopped
    networks:
      - ai-workbench-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL service (optional - only needed when DATABASE_TYPE=mysql)
  # Uncomment and configure if using MySQL
  # mysql:
  #   image: mysql:8.0
  #   container_name: ai-workbench-mysql
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
  #     - MYSQL_DATABASE=${MYSQL_DATABASE:-ai_workbench}
  #     - MYSQL_USER=${MYSQL_USER:-workbench_user}
  #     - MYSQL_PASSWORD=${MYSQL_PASSWORD:-workbench_password}
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     # Persist MySQL data
  #     - mysql-data:/var/lib/mysql
  #   restart: unless-stopped
  #   networks:
  #     - ai-workbench-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s

volumes:
  # Backend database volume (for SQLite)
  backend-db-data:
    driver: local
  # Backend logs volume
  backend-logs:
    driver: local
  # MySQL data volume
  mysql-data:
    driver: local

networks:
  ai-workbench-network:
    driver: bridge
